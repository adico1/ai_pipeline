[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pipeline"
version = "0.1.0"
description = "Evidence-driven, project-adaptable software delivery orchestration"
requires-python = ">=3.11,<3.14"
dependencies = ["crewai==1.9.3", "python-dotenv>=1.1.1,<2"]

[project.scripts]
ai-pipeline = "ai_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["ai_pipeline*"]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
